spring.application.name=audit-platform

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/audit_platform
spring.datasource.username=postgres
spring.datasource.password=Legend@47

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=5000

# Preserve existing PostgreSQL table and column names
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Overdue Corrective Action Scheduler Configuration
audit.scheduler.overdue-corrective-actions.enabled=${SCHEDULER_OVERDUE_ENABLED:true}
audit.scheduler.overdue-corrective-actions.fixed-rate=${SCHEDULER_OVERDUE_FIXED_RATE:3600000}